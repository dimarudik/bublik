---
include:
  - project: 'bigops-sre/crmsre-pipelines'
    file: '.lib-pipeline.yml'

variables:
  REGISTRY: docker-hosted.artifactory.tcsbank.ru
  BUILDER_IMAGE: $MAVEN21_BUILDER_IMAGE

cache: &global_cache
  key: "$CI_PROJECT_NAME-$CI_JOB_NAME"
  paths:
    - .m2/repository
  policy: pull-push

stages:
  - lint
  - test
  - compute-version
  - release
  - deploy


test:
  services:
    - name: $REGISTRY/testops/kuber-api:latest
    - name: $REGISTRY/testops/kuber-api-vector:latest
  image: $MAVEN21_BUILDER_IMAGE
  stage: test
  before_script:
    - dp auth service-acc --key-file $DP_ARTIFACTORY
    - dp auth configure-docker
    - dp auth configure-maven --ci
  script:
    - mvn versions:set -DnewVersion=${CI_COMMIT_REF_SLUG}-SNAPSHOT
    - mvn versions:commit
    - mvn deploy
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /skip_tests/"
      when: never
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_TAG"
  variables:
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: docker-proxy.artifactory.tcsbank.ru/
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    <<: *global_cache
