bublik {
  defaultRowsInChunk = 50000
  storages {
    from {
      type = "POSTGRES"
      url = "jdbc:postgresql://source-db:5432/postgres"
      user = "master_user"
      password = "master_password"
      threadCount = 8
      fetchSize = 1000
    }
    to {
      type = "CLICKHOUSE"
      url = "jdbc:clickhouse://analytics-db:8123/default"
      user = "click_user"
      password = "click_password"
      threadCount = 4
    }
  }
  migrations = [
    {
      taskName = "kora_integration_test_task"
      fromSchemaName = "public"
      fromTableName = "users"
      toSchemaName = "analytics"
      toTableName = "users_replica"
      fetchWhereClause = "status = 'ACTIVE'"
      withTTL = "86400"
    }
  ]
}
