version: "2"

networks:
    demo:

services:
    etcd1: &etcd
        image: dimarudik/patroni
#        networks: [ demo ]
        environment:
            ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
            ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
            ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
            ETCD_INITIAL_CLUSTER_STATE: new
            ETCD_INITIAL_CLUSTER_TOKEN: tutorial
            ETCD_UNSUPPORTED_ARCH: arm64
        hostname: etcd1
        command: etcd --name etcd1 --initial-advertise-peer-urls http://etcd1:2380

    etcd2:
        <<: *etcd
        hostname: etcd2
        command: etcd --name etcd2 --initial-advertise-peer-urls http://etcd2:2380

    etcd3:
        <<: *etcd
        hostname: etcd3
        command: etcd --name etcd3 --initial-advertise-peer-urls http://etcd3:2380

    patroni1:
      image: dimarudik/patroni
#      networks: [ demo ]
      hostname: patroni1
      container_name: demo-patroni1
      volumes:
        - ./sql/init-source.sql:/docker-entrypoint-initdb.d/init-source.sql
      ports:
        - "5432:5432"
      environment:
        PATRONI_RESTAPI_USERNAME: admin
        PATRONI_RESTAPI_PASSWORD: admin
        PATRONI_SUPERUSER_USERNAME: postgres
        PATRONI_SUPERUSER_PASSWORD: postgres
        PATRONI_REPLICATION_USERNAME: replicator
        PATRONI_REPLICATION_PASSWORD: replicate
        PATRONI_admin_PASSWORD: admin
        PATRONI_admin_OPTIONS: createdb,createrole
        ETCDCTL_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
        PATRONI_ETCD3_HOSTS: "'etcd1:2379','etcd2:2379','etcd3:2379'"
        PATRONI_SCOPE: demo
        PATRONI_NAME: patroni1

    patroni2:
      image: dimarudik/patroni
#      networks: [ demo ]
      env_file: docker/patroni.env
      hostname: patroni2
      container_name: demo-patroni2
      volumes:
        - ./sql/init-source.sql:/docker-entrypoint-initdb.d/init-source.sql
      ports:
        - "5433:5432"
      environment:
        PATRONI_RESTAPI_USERNAME: admin
        PATRONI_RESTAPI_PASSWORD: admin
        PATRONI_SUPERUSER_USERNAME: postgres
        PATRONI_SUPERUSER_PASSWORD: postgres
        PATRONI_REPLICATION_USERNAME: replicator
        PATRONI_REPLICATION_PASSWORD: replicate
        PATRONI_admin_PASSWORD: admin
        PATRONI_admin_OPTIONS: createdb,createrole
        ETCDCTL_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
        PATRONI_ETCD3_HOSTS: "'etcd1:2379','etcd2:2379','etcd3:2379'"
        PATRONI_SCOPE: demo
        PATRONI_NAME: patroni2

    target:
        image: postgres
#        networks: [ demo ]
        hostname: target
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        volumes:
          - ./sql/init-target.sql:/docker-entrypoint-initdb.d/init-target.sql
        ports:
          - "5434:5432"
