plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'org.bublik'
version = '25.1.0'

java {
	sourceCompatibility = '21'
}

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation group: 'org.bublik.core', name: 'bublik-core', version: '25.1.0'
    implementation group: 'org.bublik.postgres', name: 'bublik-postgres', version: '25.1.0'
    implementation group: 'org.bublik.oracle', name: 'bublik-oracle', version: '25.1.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
